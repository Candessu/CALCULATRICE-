name: Calculatrice CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ===== JOB 1 : Tests unitaires =====
  test:
    name: Tests de la calculatrice
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Exécution des tests
        run: |
          pytest tests/ -v --cov=calculatrice --cov-report=xml

      - name: Upload rapport de couverture
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ===== JOB 2 : Tests des opérations =====
  operations:
    name: Validation des opérations
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4

      - name: Test addition
        run: python -c "from calculatrice import add; assert add(2,3) == 5"

      - name: Test soustraction
        run: python -c "from calculatrice import sub; assert sub(5,3) == 2"

      - name: Test multiplication
        run: python -c "from calculatrice import mul; assert mul(4,3) == 12"

      - name: Test division
        run: python -c "from calculatrice import div; assert div(10,2) == 5"

      - name: Test division par zéro
        run: |
          python -c "
          from calculatrice import div
          try:
              div(5,0)
              exit(1)
          except ZeroDivisionError:
              print('OK : division par zéro gérée')
          "

  # ===== JOB 3 : Analyse de qualité =====
  lint:
    name: Analyse statique
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installation flake8
        run: pip install flake8

      - name: Vérification du code
        run: flake8 calculatrice.py --max-line-length=100

  # ===== JOB 4 : Build =====
  build:
    name: Construction du package
    runs-on: ubuntu-latest
    needs: [test, operations, lint]
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installation build
        run: pip install build

      - name: Génération du wheel
        run: python -m build

      - name: Sauvegarde de l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-package
          path: dist/

  # ===== JOB 5 : Déploiement =====
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Téléchargement de l'artifact
        uses: actions/download-artifact@v4
        with:
          name: calculatrice-package

      - name: Simulation du déploiement
        run: |
          echo "🚀 Déploiement de la calculatrice..."
          ls -la
          echo "✅ Déploiement terminé"
